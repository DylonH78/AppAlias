name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-toolchain
      - name: Expose MinGW64 to PowerShell builds
        shell: powershell
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\mingw64\bin'
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        shell: powershell
        run: |
          go build -trimpath -o dist/appalias.exe ./cmd/appalias
          go build -trimpath -o dist/launcher.exe ./cmd/appalias-launcher
          go build -trimpath -o dist/appalias-gui.exe ./cmd/appalias-gui
